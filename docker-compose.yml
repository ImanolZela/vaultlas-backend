services:
  postgres:
    image: postgres:15-alpine
    container_name: vaultlas-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-vaultlasadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vaultlaspassword}
      POSTGRES_DB: ${DB_NAME:-vaultlas_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vaultlas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vaultlasadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vaultlas-redis
    networks:
      - vaultlas-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaultlas-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-vaultlasadmin}:${DB_PASSWORD:-vaultlaspassword}@postgres:5432/${DB_NAME:-vaultlas_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - vaultlas-network
    command: >
      bash -c "alembic upgrade head &&
               uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaultlas-celery
    environment:
      DATABASE_URL: postgresql://${DB_USER:-vaultlasadmin}:${DB_PASSWORD:-vaultlaspassword}@postgres:5432/${DB_NAME:-vaultlas_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - vaultlas-network
    command: celery -A app.worker.tasks worker --loglevel=info

  frontend:
    build:
      context: ../vaultlas-frontend
      dockerfile: Dockerfile
    container_name: vaultlas-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ../vaultlas-frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - vaultlas-network

volumes:
  postgres_data:

networks:
  vaultlas-network:
    driver: bridge
